[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-demand-forecast-service"
version = "0.1.0"
description = "Demand forecasting: scikit-learn time-series backtesting and SageMaker training"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4,<2", "numpy>=2,<3", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
aws = ["sagemaker>=2.240,<3", "boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]
