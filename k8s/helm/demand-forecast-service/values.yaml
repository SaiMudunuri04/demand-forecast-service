replicaCount: 2
revisionHistoryLimit: 3
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
image:
  repository: ghcr.io/saimudunuri04/demand-forecast-service
  tag: "111c6ef55586dad190e5635406eef3b8ed7d59b1"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  type: ClusterIP
  port: 8000
  annotations: {}
containerPort: 8000
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
termination:
  gracePeriodSeconds: 45
  preStopSleepSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
probes:
  startup:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: false
  ingressFrom:
    - podSelector: {}
  egressTo: []
env: {}
envFromSecretName: ""
volumeMounts: []
volumes: []
