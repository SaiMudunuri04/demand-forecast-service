name: test-build
on:
  push:
    branches: [main]
    paths-ignore: [helm/chart/values.yaml]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/saimudunuri04/demand-forecast-service:${{ github.sha }}
      - name: Pin Argo CD image to tested commit
        run: |
          sed -i 's/^  tag:.*/  tag: "'"$GITHUB_SHA"'"/' helm/chart/values.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add helm/chart/values.yaml
          git diff --cached --quiet || git commit -m "Pin image to $GITHUB_SHA [skip ci]"
          git push
